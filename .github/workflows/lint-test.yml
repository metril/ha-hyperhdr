name: Lint & Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    name: Lint & Test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest

  release:
    name: Release
    needs: lint-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Read version
        id: v
        run: |
          VERSION=$(jq -r .version custom_components/hyperhdr/manifest.json)
          PY=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          [ "$VERSION" = "$PY" ] || { echo "::error::manifest ($VERSION) != pyproject ($PY)"; exit 1; }
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check tag
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build zip
        if: steps.exists.outputs.exists == 'false'
        run: cd custom_components/hyperhdr && zip -r ../../hyperhdr.zip . -x '__pycache__/*' '*.pyc'
      - name: Create release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" hyperhdr.zip \
            --target "$GITHUB_SHA" --title "${{ steps.v.outputs.tag }}" --generate-notes
