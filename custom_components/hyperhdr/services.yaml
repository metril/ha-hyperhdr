set_color:
  target:
    device:
      integration: hyperhdr
    entity:
      integration: hyperhdr
      domain: light
  fields:
    rgb_color:
      required: true
      selector:
        color_rgb:
    priority:
      required: false
      selector:
        number:
          min: 1
          max: 253
          mode: box
    duration:
      required: false
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: box

set_effect:
  target:
    device:
      integration: hyperhdr
    entity:
      integration: hyperhdr
      domain: light
  fields:
    effect:
      required: true
      selector:
        text:
    priority:
      required: false
      selector:
        number:
          min: 1
          max: 253
          mode: box
    duration:
      required: false
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: box

clear:
  target:
    device:
      integration: hyperhdr
    entity:
      integration: hyperhdr
      domain: light
  fields:
    priority:
      required: true
      selector:
        number:
          min: -1
          max: 253
          mode: box
